<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartivo Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0B0A0F; font-family: 'Inter', sans-serif; color: #fff; }
        /* slide menu styles */
        .menu-btn { position: fixed; top: 20px; left: 20px; z-index: 100; background: #1A191F; border: none; color: #00C6FF; font-size: 28px; cursor: pointer; padding: 10px 15px; border-radius: 12px; }
        .side-menu { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: #0B0A0F; border-right: 1px solid #0072FF; transition: 0.3s; z-index: 200; padding: 80px 20px 20px; backdrop-filter: blur(20px); }
        .side-menu.open { left: 0; }
        .side-menu a { display: block; padding: 15px 20px; color: #ccc; text-decoration: none; margin: 8px 0; border-radius: 12px; transition: 0.2s; }
        .side-menu a:hover, .side-menu a.active { background: #1A191F; color: #00C6FF; border-left: 3px solid #00C6FF; }
        .main-content { margin-left: 20px; padding: 20px; transition: 0.3s; }
        .content-section { display: none; }
        .content-section.active { display: block; }
        .stat-card, .form-card, .list-card { background: #1A191F; border-radius: 24px; padding: 20px; margin-bottom: 20px; border: 1px solid #2C2B32; }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-number { font-size: 2rem; font-weight: 800; color: #00C6FF; }
        input, select, textarea { width: 100%; background: #0B0A0F; border: 1px solid #2C2B32; border-radius: 40px; padding: 10px 16px; margin-bottom: 12px; color: white; }
        button { background: #0072FF; border: none; border-radius: 40px; padding: 10px 20px; color: white; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #2C2B32; }
        .login-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:#0B0A0F; display:flex; justify-content:center; align-items:center; z-index:1000; }
        .login-box { background:#1A191F; padding:40px; border-radius:32px; text-align:center; }
        .error { color: #ff5555; margin-top: 10px; }
    </style>
</head>
<body>
<div id="loginOverlay" class="login-overlay">
    <div class="login-box">
        <h2>Admin Access</h2>
        <input type="password" id="adminPassword" placeholder="Password" style="margin:20px 0;">
        <button onclick="login()">Login</button>
        <div id="loginError" class="error"></div>
    </div>
</div>

<div id="app" style="display:none;">
    <button class="menu-btn" id="menuBtn">☰</button>
    <div class="side-menu" id="sideMenu">
        <a href="#" data-section="dashboard">📊 Dashboard</a>
        <a href="#" data-section="projects">📁 Projects</a>
        <a href="#" data-section="leads">📩 Leads</a>
        <a href="#" data-section="visitors">👁 Visitors</a>
        <a href="#" data-section="expenses">💰 Expenses</a>
        <a href="#" onclick="logout()" style="margin-top:40px;">🚪 Logout</a>
    </div>
    <div class="main-content" id="mainContent">
        <div id="dashboard" class="content-section active">
            <h2>Dashboard</h2>
            <div class="stat-grid" id="statsContainer"></div>
        </div>
        <div id="projects" class="content-section">
            <h2>Projects</h2>
            <div class="form-card"><h3>Create New Project</h3><input id="projName" placeholder="Business Name"><input id="projInsta" placeholder="Instagram Handle"><input id="projContact" placeholder="Contact Name"><input id="projImageUrl" placeholder="Image URL"><button onclick="createProject()">Create</button></div>
            <div class="list-card"><table><thead><tr><th>ID</th><th>Business</th><th>Status</th><th>Earnings</th><th>Actions</th></tr></thead><tbody id="projectsList"></tbody></table></div>
        </div>
        <div id="leads" class="content-section"><h2>Leads</h2><div class="list-card"><table><thead><tr><th>Business</th><th>Instagram</th><th>Email</th><th>Request</th><th>Image</th></tr></thead><tbody id="leadsList"></tbody></table></div></div>
        <div id="visitors" class="content-section"><h2>Visitors</h2><div class="list-card"><table><thead><tr><th>IP</th><th>Browser</th><th>Page</th><th>Time</th></tr></thead><tbody id="visitorsList"></tbody></table></div></div>
        <div id="expenses" class="content-section"><h2>Monthly Expenses</h2><div class="form-card"><input id="expAmount" placeholder="Amount"><input id="expDesc" placeholder="Description"><button onclick="addExpense()">Add Expense</button></div></div>
    </div>
</div>

<script>
    let token = sessionStorage.getItem('adminAuth');
    if(token === 'true') { document.getElementById('loginOverlay').style.display='none'; document.getElementById('app').style.display='block'; loadAll(); }
    async function login() {
        const pwd = document.getElementById('adminPassword').value;
        const res = await fetch('/api/admin/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:pwd}) });
        const data = await res.json();
        if(data.success) {
            sessionStorage.setItem('adminAuth','true');
            location.reload();
        } else {
            document.getElementById('loginError').innerText = data.error || 'Login failed';
        }
    }
    function logout() { fetch('/api/admin/logout',{method:'POST'}).then(()=>{ sessionStorage.removeItem('adminAuth'); location.reload(); }); }
    async function loadAll() { await loadStats(); await loadProjects(); await loadLeads(); await loadVisitors(); }
    async function loadStats() { const res=await fetch('/api/analytics'); const d=await res.json(); document.getElementById('statsContainer').innerHTML = `
        <div class="stat-card"><div class="stat-number">$${d.totalEarningsAll.toFixed(2)}</div><div>All Earnings</div></div>
        <div class="stat-card"><div class="stat-number">$${d.monthlyEarnings.toFixed(2)}</div><div>This Month</div></div>
        <div class="stat-card"><div class="stat-number">$${d.monthlySpent.toFixed(2)}</div><div>Spent</div></div>
        <div class="stat-card"><div class="stat-number">${d.openProjects}</div><div>Open Projects</div></div>
        <div class="stat-card"><div class="stat-number">${d.completedProjects}</div><div>Completed</div></div>
    `; }
    async function loadProjects() { const res=await fetch('/api/projects'); const projs=await res.json(); let html=''; projs.forEach(p=>{ html+=`<tr><td>${p.id}</td><td>${p.business_name}</td><td>${p.status}</td><td>$${p.earnings||0}</td><td><button onclick="viewProject(${p.id})">View</button> <button onclick="completeProject(${p.id})">Complete</button> <button onclick="addEarnings(${p.id})">+Earnings</button></td></tr>`; }); document.getElementById('projectsList').innerHTML=html; }
    async function createProject(){ const name=document.getElementById('projName').value; if(!name) return; await fetch('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({business_name:name, instagram_handle:document.getElementById('projInsta').value, contact_name:document.getElementById('projContact').value, image_url:document.getElementById('projImageUrl').value})}); loadProjects(); }
    async function completeProject(id){ const earn=prompt('Earnings for this project?','0'); await fetch(`/api/projects/${id}/complete`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({earnings:parseFloat(earn)||0})}); loadProjects(); loadStats(); }
    async function addEarnings(id){ const amt=prompt('Amount to add?','0'); if(amt) await fetch(`/api/projects/${id}/earnings`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:parseFloat(amt)})}); loadProjects(); loadStats(); }
    async function loadLeads(){ const res=await fetch('/api/leads'); const leads=await res.json(); let html=''; leads.forEach(l=>{ html+=`<tr><td>${l.business_name}</td><td>${l.instagram_handle}</td><td>${l.email}</td><td>${l.special_request||''}</td><td>${l.image_path?`<a href="${l.image_path}" target="_blank">View</a>`:'-'}</td></tr>`; }); document.getElementById('leadsList').innerHTML=html; }
    async function loadVisitors(){ const res=await fetch('/api/visitors?limit=50'); const visitors=await res.json(); let html=''; visitors.forEach(v=>{ html+=`<tr><td>${v.ip}</td><td>${(v.user_agent||'').substring(0,60)}</td><td>${v.page}</td><td>${new Date(v.timestamp).toLocaleString()}</td></tr>`; }); document.getElementById('visitorsList').innerHTML=html; }
    async function addExpense(){ const amt=document.getElementById('expAmount').value; if(!amt) return; await fetch('/api/expenses',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:parseFloat(amt), description:document.getElementById('expDesc').value})}); loadStats(); document.getElementById('expAmount').value=''; document.getElementById('expDesc').value=''; }
    function viewProject(id){ window.location.href=`/project/${id}`; }
    // side menu
    document.getElementById('menuBtn').onclick = () => document.getElementById('sideMenu').classList.toggle('open');
    document.querySelectorAll('.side-menu a[data-section]').forEach(link => { link.onclick = (e) => { e.preventDefault(); const section = link.dataset.section; document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active')); document.getElementById(section).classList.add('active'); document.getElementById('sideMenu').classList.remove('open'); }; });
    setInterval(loadStats, 30000);
</script>
</body>
</html>
