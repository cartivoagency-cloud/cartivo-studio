<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Project Detail</title><style>body{background:#0B0A0F;font-family:Inter;color:#fff;padding:40px;}.card{background:#1A191F;border-radius:32px;padding:30px;max-width:600px;margin:auto;}</style></head>
<body>
<div class="card"><h2 id="title"></h2><div id="info"></div><input id="earnAmount" placeholder="Add earnings"><button onclick="addEarnings()">Add Earnings</button><button onclick="completeProject()" id="completeBtn">Mark Complete</button><br><button onclick="window.location.href='/admin'">Back to Admin</button></div>
<script>
    const id = window.location.pathname.split('/').pop();
    let project = null;
    async function load(){ const res=await fetch(`/api/projects/${id}`); project=await res.json(); document.getElementById('title').innerText=project.business_name; document.getElementById('info').innerHTML=`<p>Status: ${project.status}</p><p>Earnings: $${project.earnings||0}</p><p>Instagram: ${project.instagram_handle||'-'}</p><p>Created: ${new Date(project.created_at).toLocaleString()}</p>`; if(project.status==='completed') document.getElementById('completeBtn').disabled=true; }
    async function addEarnings(){ const amt=document.getElementById('earnAmount').value; if(amt){ await fetch(`/api/projects/${id}/earnings`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:parseFloat(amt)})}); load(); } }
    async function completeProject(){ await fetch(`/api/projects/${id}/complete`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({})}); load(); }
    load();
</script>
</body>
</html>
